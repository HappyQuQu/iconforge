<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the theme before the first paint to avoid a light flash.
      (() => {
        let theme = "system"
        try {
          theme = localStorage.getItem("iconforge.theme") || "system"
        } catch { /* Storage may be unavailable. */ }
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IconForge — 在浏览器里把底图和 Logo 合成一张图标，数据不出浏览器。" />
    <title>IconForge — 合成你的图标</title>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="d7aa1126-1498-4b64-83f1-15019f7de9c1"
      data-domains="iconforge.qudev.top,localhost,127.0.0.1"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
